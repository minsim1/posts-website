<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunset</title>
    <style>
      :root {
        color-scheme: dark;

        --color-primary: #4a9eff;
        --color-text: #e4e4e4;
        --color-text-secondary: #b0b0b0;
        --color-border: #333;
        --color-bg-main: #1a1a1a;
        --color-bg-light: #242424;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--color-bg-main);
        color: var(--color-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        line-height: 1.6;
      }

      .card {
        width: min(700px, 100%);
        background: var(--color-bg-light);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        border-top: 3px solid var(--color-primary);
        padding: 1.5rem;
      }

      h1 {
        margin-bottom: 0.75rem;
        font-size: 1.5rem;
        line-height: 1.2;
        color: var(--color-primary);
      }

      p {
        color: var(--color-text-secondary);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Goodbye and Thank You!</h1>
      <p>I am incredibly grateful for all of the posts and comments that were made on this site. It was a pleasure to read them all.</p>
    </main>
  </body>
</html>
